<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perplexity Explorer</title>

  <style>
    /* ── Reset & page background ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #1e293b;
      line-height: 1.6;
      padding: 2rem 1rem;
    }
    .container { max-width: 840px; margin: 0 auto; }

    /* ── Page title ── */
    h1 {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 0.3rem;
      /* Gradient text for a modern look */
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    /* ── White cards with rounded corners + shadow ── */
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 4px 16px rgba(0,0,0,0.04);
    }
    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 1rem;
      color: #334155;
    }
    /* Dimmed helper text inside headings */
    .dim { font-weight: 400; color: #94a3b8; font-size: 0.85rem; }

    /* ── Textarea for sentences ── */
    #sentence {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1.05rem;
      font-family: inherit;
      resize: none;
      height: 52px;
      transition: border-color 0.2s;
    }
    #sentence:focus { outline: none; border-color: #818cf8; }

    /* ── Shared button base ── */
    .btn {
      display: inline-block;
      padding: 0.5rem 1.2rem;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s;
    }
    .btn:active { transform: scale(0.97); }

    /* Blue / purple primary button */
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      font-weight: 600;
      padding: 0.6rem 1.5rem;
      font-size: 0.95rem;
    }
    .btn-primary:hover { box-shadow: 0 4px 14px rgba(79,70,229,0.35); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Sample / preset buttons */
    .btn-sample {
      background: #f0f0ff;
      color: #4f46e5;
      border: 1px solid #c7d2fe;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 0.82rem;
    }
    .btn-sample:hover { background: #e0e7ff; }

    .btn-outline {
      background: #f8fafc;
      color: #475569;
      border: 1.5px solid #e2e8f0;
    }
    .btn-outline:hover { background: #f1f5f9; border-color: #cbd5e1; }

    /* Small red "Remove" button */
    .btn-danger-sm {
      background: none;
      color: #ef4444;
      border: 1px solid #fecaca;
      padding: 0.25rem 0.65rem;
      font-size: 0.78rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-danger-sm:hover { background: #fef2f2; }

    /* ── Layout helpers ── */
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .mt  { margin-top: 0.75rem; }
    .mb  { margin-bottom: 0.75rem; }

    /* ── Status line under the Calculate button ── */
    #status { margin-top: 0.6rem; font-size: 0.9rem; min-height: 1.4em; }
    #status.loading { color: #d97706; }
    #status.ready   { color: #059669; }
    #status.err     { color: #dc2626; font-weight: 600; }

    /* ── Red error box ── */
    .error-box {
      background: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      color: #b91c1c;
      font-weight: 600;
      margin-top: 1rem;
    }

    /* ── Data tables ── */
    table { width: 100%; border-collapse: collapse; margin: 0.75rem 0; font-size: 0.9rem; }
    th {
      text-align: left;
      padding: 0.5rem 0.6rem;
      background: #f8fafc;
      border-bottom: 2px solid #e2e8f0;
      font-weight: 600;
      color: #475569;
      font-size: 0.82rem;
    }
    td { padding: 0.45rem 0.6rem; border-bottom: 1px solid #f1f5f9; }

    /* Monospace token badge */
    .tok {
      font-family: "SF Mono", "Fira Code", monospace;
      background: #f0f0ff;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.88rem;
    }

    /* ── Three-step calculation box ── */
    .steps-box {
      background: #fafbff;
      border: 1px solid #ede9fe;
      border-radius: 10px;
      padding: 1.25rem;
      margin-top: 1rem;
    }
    .step { margin-bottom: 0.65rem; }
    .step-lbl { font-weight: 700; color: #6366f1; font-size: 0.85rem; }
    .formula {
      font-family: "SF Mono", monospace;
      font-size: 0.82rem;
      background: #f5f3ff;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      overflow-x: auto;
      white-space: nowrap;
      margin: 0.3rem 0;
    }
    /* Big perplexity number at the bottom */
    .big-num {
      font-size: 2.2rem;
      font-weight: 800;
      text-align: center;
      color: #4f46e5;
      margin-top: 0.5rem;
    }

    /* ── Horizontal bar chart for Section 3 ── */
    .bars { display: flex; flex-direction: column; gap: 6px; }
    .bar-row { display: flex; align-items: center; gap: 8px; }
    .bar-lbl {
      width: 100px;
      text-align: right;
      font-family: monospace;
      font-size: 0.82rem;
      overflow: hidden;
      white-space: nowrap;
    }
    .bar-track {
      flex: 1;
      background: #f1f5f9;
      border-radius: 6px;
      height: 26px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 6px;
      background: #c7d2fe;
      display: flex;
      align-items: center;
      padding-left: 8px;
      font-size: 0.72rem;
      color: #3730a3;
      font-weight: 600;
      transition: width 0.3s;
    }
    /* Highlighted top-1 bar */
    .bar-fill.top {
      background: linear-gradient(90deg, #6366f1, #7c3aed);
      color: #fff;
    }

    /* ── Manual-calculator input rows ── */
    .manual-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
      align-items: center;
    }
    .manual-row input {
      padding: 0.4rem 0.6rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.88rem;
      font-family: inherit;
    }
    .manual-row input:focus { outline: none; border-color: #818cf8; }
    .tok-in  { width: 130px; }
    .prob-in { width: 100px; }
    .row-num { color: #94a3b8; font-size: 0.82rem; width: 22px; text-align: right; }

    /* ── Utility ── */
    .hidden { display: none !important; }

    @media (max-width: 600px) {
      body { padding: 1rem 0.5rem; }
      .card { padding: 1.25rem; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>

<body>
<div class="container">

  <h1>🔍 Perplexity Explorer</h1>
  <p class="subtitle">See how a real language model measures surprise, token by token</p>

  <!-- ════════════════════════════════════════════════
       Section 1 – Type a sentence
       ════════════════════════════════════════════════ -->
  <div class="card">
    <h2>1 · Type a sentence</h2>

    <!-- Text box with a default sentence -->
    <textarea id="sentence">I love Python</textarea>

    <!-- Three sample buttons — clicking one fills the box and calculates -->
    <div class="row mt mb">
      <span style="color:#94a3b8;font-size:.85rem">Try:</span>
      <button class="btn btn-sample" data-text="I love Python">I love Python</button>
      <button class="btn btn-sample" data-text="Python love I">Python love I</button>
      <button class="btn btn-sample" data-text="The capital of France is Paris">The capital of France is Paris</button>
    </div>

    <!-- Main action button -->
    <button class="btn btn-primary" id="calc-btn">Calculate perplexity</button>

    <!-- Status line: shows "Downloading the model…" / "Model ready" / errors -->
    <div id="status"></div>
  </div>

  <!-- ════════════════════════════════════════════════
       Section 2 – Token probabilities → perplexity
       (hidden until a calculation is run)
       ════════════════════════════════════════════════ -->
  <div class="card hidden" id="sec2">
    <h2>2 · Probability of each token → perplexity</h2>
    <div id="prob-area"></div>
  </div>

  <!-- ════════════════════════════════════════════════
       Section 3 – Next-token predictions
       (hidden until a calculation is run)
       ════════════════════════════════════════════════ -->
  <div class="card hidden" id="sec3">
    <h2>3 · What does the model predict next?</h2>
    <div id="pred-area"></div>
  </div>

  <!-- ════════════════════════════════════════════════
       Section 4 – Try it by hand (simulated)
       ════════════════════════════════════════════════ -->
  <div class="card">
    <h2>4 · Try it by hand <span class="dim">(Simulated, not from the model)</span></h2>

    <!-- Preset buttons fill the rows with example data -->
    <div class="row mb">
      <span style="color:#94a3b8;font-size:.85rem">Presets:</span>
      <button class="btn btn-outline" id="pre-love">"I love Python"</button>
      <button class="btn btn-outline" id="pre-uniform">"All 1/8"</button>
      <button class="btn btn-outline" id="pre-surprise">"One surprising word"</button>
    </div>

    <!-- Editable rows (token + probability) are injected here -->
    <div id="manual-rows"></div>

    <!-- Button to append one more row -->
    <button class="btn btn-outline mt" id="add-row-btn">+ Add token</button>

    <!-- Live-updating table + perplexity steps appear here -->
    <div id="manual-out"></div>
  </div>

</div><!-- /.container -->


<!-- ═══════════════════════════════════════════════════
     All JavaScript — plain ES-module, no build step
     ═══════════════════════════════════════════════════ -->
<script type="module">

/* ──────────────────────────────────────────────
   Import Transformers.js v3 from a CDN.
   Everything runs in the browser — no server needed.
   ────────────────────────────────────────────── */
import {
  AutoTokenizer,
  AutoModelForCausalLM,
  Tensor,
  env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3";

// Ensure browser Cache API is enabled so model files are cached across page refreshes
env.useBrowserCache = true;


/* ── Global state ── */
let tokenizer   = null;      // cached in memory once loaded
let model       = null;      // cached in memory once loaded
let modelReady  = false;     // flag so we only load once per session
let loadPromise = null;      // singleton promise to prevent concurrent loading calls


/* ── Grab DOM elements we'll use repeatedly ── */
const sentenceEl   = document.getElementById("sentence");
const calcBtn      = document.getElementById("calc-btn");
const statusEl     = document.getElementById("status");
const sec2         = document.getElementById("sec2");
const sec3         = document.getElementById("sec3");
const probArea     = document.getElementById("prob-area");
const predArea     = document.getElementById("pred-area");
const manualRowsEl = document.getElementById("manual-rows");
const manualOutEl  = document.getElementById("manual-out");


/* ═══════════════════════════════════════════════
   HELPER: Stable softmax
   Subtracts the max logit first so exp() doesn't overflow.
   Returns a Float64Array of probabilities that sum to 1.
   ═══════════════════════════════════════════════ */
function softmax(arr) {
  let max = -Infinity;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] > max) max = arr[i];
  }
  const out = new Float64Array(arr.length);
  let sum = 0;
  for (let i = 0; i < arr.length; i++) {
    out[i] = Math.exp(arr[i] - max);
    sum += out[i];
  }
  for (let i = 0; i < arr.length; i++) out[i] /= sum;
  return out;
}


/* ═══════════════════════════════════════════════
   Load model + tokenizer (runs only once)
   ═══════════════════════════════════════════════ */
async function ensureModel() {
  if (modelReady) return;
  if (loadPromise) return loadPromise;

  calcBtn.disabled = true;

  // Check if model files are already cached in browser CacheStorage
  let isCached = false;
  try {
    if (window.caches) {
      const cache = await caches.open("transformers-cache");
      const keys = await cache.keys();
      // Check if any Xenova/distilgpt2 onnx or weight file exists in cache
      isCached = keys.some(req => req.url.includes("distilgpt2"));
    }
  } catch (e) {
    // If CacheStorage inspection fails, proceed normally
  }

  if (isCached) {
    setStatus("Loading model from browser cache…", "loading");
  } else {
    setStatus("Downloading the model… (≈80 MB, first time only)", "loading");
  }

  loadPromise = (async () => {
    try {
      const progressCallback = (info) => {
        if (info.status === "progress" && typeof info.progress === "number") {
          const pct = Math.round(info.progress);
          setStatus(`Downloading model… ${pct}% (≈80 MB, first time only)`, "loading");
        } else if (info.status === "done") {
          setStatus("Initializing model in browser…", "loading");
        }
      };

      // Load tokenizer and model
      [tokenizer, model] = await Promise.all([
        AutoTokenizer.from_pretrained("Xenova/distilgpt2"),
        AutoModelForCausalLM.from_pretrained("Xenova/distilgpt2", {
          dtype: "q8",
          progress_callback: progressCallback
        })
      ]);

      modelReady = true;
      setStatus("Model ready ✓", "ready");
    } catch (err) {
      loadPromise = null;
      setStatus("", "");
      sec2.classList.remove("hidden");
      sec2.querySelector("h2").insertAdjacentHTML(
        "afterend",
        `<div class="error-box">⚠️ Failed to load model: ${escHtml(err.message)}</div>`
      );
      throw err;
    } finally {
      calcBtn.disabled = false;
    }
  })();

  return loadPromise;
}


/* ── Status-line helpers ── */
function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = cls || "";
}


/* ═══════════════════════════════════════════════
   MAIN: Tokenise → run model → show results
   ═══════════════════════════════════════════════ */
async function calculate() {
  const text = sentenceEl.value.trim();
  if (!text) {
    setStatus("Please type a sentence first.", "err");
    return;
  }

  // Load the model if this is the first click
  try { await ensureModel(); } catch { return; }

  setStatus("Computing…", "loading");
  calcBtn.disabled = true;

  try {
    /* ── 1. Tokenise the sentence ── */
    const encoded = tokenizer.encode(text);
    // encoded is an array of integer token IDs, e.g. [40, 1842, 11361]

    /* Prepend 50256 (<|endoftext|> = GPT-2 start token).
       This lets the model assign a probability to the very first word. */
    const ids = [50256, ...encoded];

    /* ── 2. Build the input tensors ──
       Shape: [1, sequence_length] (batch of 1).
       ONNX graph requires input_ids, attention_mask, and position_ids. */
    const inputIds = new Tensor(
      "int64",
      BigInt64Array.from(ids.map(x => BigInt(x))),
      [1, ids.length]
    );

    const attentionMask = new Tensor(
      "int64",
      BigInt64Array.from(ids.map(() => 1n)),
      [1, ids.length]
    );

    const positionIds = new Tensor(
      "int64",
      BigInt64Array.from(ids.map((_, idx) => BigInt(idx))),
      [1, ids.length]
    );

    /* ── 3. Run one forward pass ──
       output.logits has shape [1, sequence_length, vocabulary_size]. */
    const output = await model({
      input_ids: inputIds,
      attention_mask: attentionMask,
      position_ids: positionIds
    });
    const logits    = output.logits;
    const data      = logits.data;       // flat Float32Array
    const vocabSize = logits.dims[2];    // 50257 for GPT-2

    /* ── 4. Extract each token's probability ──
       Token ids[i] (i ≥ 1) is predicted by logits at position i-1,
       because the model at position j predicts what comes at j+1. */
    const tokens = [];   // decoded text for each token
    const probs  = [];   // P(token | everything before it)

    for (let i = 1; i < ids.length; i++) {
      const tokenId = ids[i];

      // Grab the logits row that predicts this token
      const offset = (i - 1) * vocabSize;
      const row    = data.slice(offset, offset + vocabSize);

      // Softmax → probability of this specific token
      const sm = softmax(row);
      const p  = sm[tokenId];

      // Decode the token ID back to readable text
      const decoded = tokenizer.decode([tokenId]);

      tokens.push(decoded);
      probs.push(p);
    }

    // Guard: make sure we got tokens
    if (tokens.length === 0) {
      setStatus("No tokens found — try a different sentence.", "err");
      return;
    }

    /* ── 5. Show Section 2: probability table + perplexity ── */
    sec2.classList.remove("hidden");
    probArea.innerHTML = "";
    renderTableAndSteps(tokens, probs, probArea);

    /* ── 6. Show Section 3: top-8 next-token predictions ──
       We use the logits at the LAST position for this. */
    const lastOffset = (ids.length - 1) * vocabSize;
    const lastRow    = data.slice(lastOffset, lastOffset + vocabSize);
    sec3.classList.remove("hidden");
    predArea.innerHTML = "";
    renderPredictions(lastRow, predArea);

    setStatus("Done ✓", "ready");

    // Smooth-scroll down so the user sees the results
    sec2.scrollIntoView({ behavior: "smooth", block: "start" });

  } catch (err) {
    sec2.classList.remove("hidden");
    probArea.innerHTML = `<div class="error-box">⚠️ Computation failed: ${escHtml(err.message)}</div>`;
    sec3.classList.add("hidden");
    setStatus("Error", "err");
  } finally {
    calcBtn.disabled = false;
  }
}


/* ═══════════════════════════════════════════════
   RENDER: probability table + three-step perplexity
   Used by both Section 2 (real model) and Section 4 (manual).
   ═══════════════════════════════════════════════ */
function renderTableAndSteps(tokens, probs, container) {

  /* ── Token table ── */
  let html = `<table><thead><tr>
    <th>#</th><th>Token</th><th>Probability P</th><th>1 / P</th>
  </tr></thead><tbody>`;

  for (let i = 0; i < tokens.length; i++) {
    // Replace ordinary spaces with ␣ so they're visible
    const display = tokens[i].replace(/ /g, "␣");
    const p   = probs[i];
    const inv = 1 / p;
    html += `<tr>
      <td>${i + 1}</td>
      <td><span class="tok">${escHtml(display)}</span></td>
      <td>${fmtP(p)}</td>
      <td>${fmtNum(inv)}</td>
    </tr>`;
  }
  html += "</tbody></table>";

  /* ── Perplexity (computed with logs so long sentences don't overflow) ──
     Formula: perplexity = exp( average of −ln P ) */
  const sumNegLogP = probs.reduce((s, p) => s - Math.log(p), 0);
  const avg        = sumNegLogP / probs.length;
  const perplexity = Math.exp(avg);

  // Product of 1/P for display (also via logs to stay safe)
  const logProduct = probs.reduce((s, p) => s + Math.log(1 / p), 0);
  const product    = Math.exp(logProduct);

  // Strings like "2.00 × 1.25 × 5.00"
  const invStrs = probs.map(p => fmtNum(1 / p));

  /* ── Three-step breakdown ── */
  html += `<div class="steps-box">`;

  // Step 1: multiply all 1/P values
  html += `<div class="step">
    <div class="step-lbl">Step 1 — Multiply all 1/P values</div>
    <div class="formula">${invStrs.join(" × ")} = ${fmtBig(product)}</div>
  </div>`;

  // Step 2: how many tokens
  html += `<div class="step">
    <div class="step-lbl">Step 2 — Count the tokens</div>
    <div class="formula">N = ${probs.length}</div>
  </div>`;

  // Step 3: take the N-th root
  html += `<div class="step">
    <div class="step-lbl">Step 3 — Perplexity = (product)<sup>1/N</sup></div>
    <div class="formula">(${fmtBig(product)})<sup>1/${probs.length}</sup> = exp( mean of −ln P ) = <b>${perplexity.toFixed(2)}</b></div>
  </div>`;

  // Big highlighted number
  html += `<div class="big-num">${perplexity.toFixed(2)}</div>`;
  html += `</div>`;

  container.innerHTML = html;
}


/* ═══════════════════════════════════════════════
   RENDER: top-8 next-token bar chart (Section 3)
   ═══════════════════════════════════════════════ */
function renderPredictions(logitsRow, container) {
  const sm = softmax(logitsRow);

  // Build an array of { prob, index } and sort descending
  const indexed = [];
  for (let i = 0; i < sm.length; i++) indexed.push({ p: sm[i], i });
  indexed.sort((a, b) => b.p - a.p);
  const top8 = indexed.slice(0, 8);

  const maxP = top8[0].p;   // for scaling bar widths

  let html = `<div class="bars">`;
  for (let rank = 0; rank < top8.length; rank++) {
    const { p, i } = top8[rank];
    const decoded = tokenizer.decode([i]).replace(/ /g, "␣");
    const pct     = (p * 100).toFixed(1);
    const width   = Math.max(3, (p / maxP) * 100);   // relative to top bar
    const cls     = rank === 0 ? "bar-fill top" : "bar-fill";

    html += `<div class="bar-row">
      <span class="bar-lbl"><span class="tok">${escHtml(decoded)}</span></span>
      <div class="bar-track">
        <div class="${cls}" style="width:${width}%">${pct}%</div>
      </div>
    </div>`;
  }
  html += `</div>`;
  container.innerHTML = html;
}


/* ═══════════════════════════════════════════════
   SECTION 4: manual / simulated perplexity
   ═══════════════════════════════════════════════ */

// Each entry: { token: string, prob: string }
let manualData = [];

/* Add one editable row */
function addManualRow(token = "", prob = "") {
  manualData.push({ token, prob: String(prob) });
  renderManual();
}

/* Remove a row by index */
function removeManualRow(idx) {
  manualData.splice(idx, 1);
  renderManual();
}

/* Replace all rows with preset data */
function setPreset(tokens, probs) {
  manualData = tokens.map((t, i) => ({ token: t, prob: String(probs[i]) }));
  renderManual();
}

/* Re-draw the input rows and the results underneath */
function renderManual() {
  // ── Build input rows ──
  let html = "";
  for (let i = 0; i < manualData.length; i++) {
    html += `<div class="manual-row">
      <span class="row-num">${i + 1}.</span>
      <input class="tok-in" type="text" placeholder="Token"
             value="${escAttr(manualData[i].token)}"
             data-idx="${i}" data-field="token">
      <input class="prob-in" type="number" placeholder="P (0–1)"
             step="any" min="0.0001" max="1"
             value="${escAttr(manualData[i].prob)}"
             data-idx="${i}" data-field="prob">
      <button class="btn-danger-sm" data-remove="${i}">Remove</button>
    </div>`;
  }
  manualRowsEl.innerHTML = html;

  // Live-update: re-calculate whenever the user types
  manualRowsEl.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", () => {
      const idx   = +inp.dataset.idx;
      const field = inp.dataset.field;
      manualData[idx][field] = inp.value;
      renderManualOutput();   // only re-render the results, not the inputs
    });
  });

  // Wire up the Remove buttons
  manualRowsEl.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", () => removeManualRow(+btn.dataset.remove));
  });

  renderManualOutput();
}

/* Re-compute and display the manual results table + perplexity */
function renderManualOutput() {
  // Collect only rows with a non-empty token AND a valid probability
  const tokens = [];
  const probs  = [];
  for (const row of manualData) {
    const p = parseFloat(row.prob);
    if (row.token && p > 0 && p <= 1) {
      tokens.push(row.token);
      probs.push(p);
    }
  }

  if (tokens.length === 0) {
    manualOutEl.innerHTML =
      `<p style="color:#94a3b8;margin-top:1rem">
         Enter at least one token with a valid probability (0 to 1).
       </p>`;
    return;
  }

  // Reuse the same rendering function as Section 2
  renderTableAndSteps(tokens, probs, manualOutEl);
}

/* ═══════════════════════════════════════════════
   UTILITY FUNCTIONS
   ═══════════════════════════════════════════════ */

/* Format a probability (always show enough decimal places) */
function fmtP(n) {
  if (n >= 0.01)   return n.toFixed(4);
  if (n >= 0.0001) return n.toFixed(6);
  return n.toExponential(3);
}

/* Format a general number */
function fmtNum(n) {
  if (n >= 10000)  return n.toFixed(1);
  if (n >= 100)    return n.toFixed(2);
  if (n >= 1)      return n.toFixed(4);
  if (n >= 0.0001) return n.toFixed(6);
  return n.toExponential(3);
}

/* Format a potentially huge number (product of 1/P values) */
function fmtBig(n) {
  if (!isFinite(n))  return "∞";
  if (n > 1e15)      return n.toExponential(4);
  if (n >= 1000)     return n.toFixed(2);
  return n.toFixed(4);
}

/* Escape HTML so token text can't break the page */
function escHtml(s) {
  return s
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* Escape a string for use inside an HTML attribute (value="…") */
function escAttr(s) {
  return s
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}
